modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
MomoLib — 漠漠模组通用前置库。
提供加权行为框架（Behavior 权重随机选择）和 UI 模板组件库（容器、滚动条、输入框、按钮等）。
依赖 TLM（Touhou Little Maid）。
'''

[[dependencies.${mod_id}]]
modId = "touhou_little_maid"
type = "required"
versionRange = "[2.0.0,)"
ordering = "NONE"
side = "BOTH"
